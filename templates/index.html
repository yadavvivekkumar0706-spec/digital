<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital — Shopping List</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- MAIN INTRO -->

    <main>

        <h1>DIGITAL</h1>

        <h2>SHOPPING LIST</h2>

        <p>
            Organize your shopping, simply and beautifully.
        </p>


        <!-- CREATE LIST -->

        <button id="create-list-btn">
            + CREATE NEW LIST
        </button>


        <!-- CREATE LIST FORM -->

        <div id="create-list-form"
             class="create-list-form">

            <input
                type="text"
                id="list-name"
                placeholder="Enter list name"
            >

            <button id="save-list-btn">
                Create
            </button>

        </div>


        <!-- LIST SECTION -->

        <section>

            <h2>MY LISTS</h2>

            <div id="lists-container">

                <!-- Lists will be created here by JavaScript -->

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
